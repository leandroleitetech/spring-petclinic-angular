<div class="container login-container">
  <div class="row justify-content-center">
    <div class="col-12 col-md-5">
      <h2>Recuperar senha</h2>
      <form (ngSubmit)="onSubmit()" #forgotForm="ngForm" novalidate>
        <div class="mb-3">
          <label for="username" class="form-label">Usuário</label>
          <input id="username" name="username" type="text" class="form-control"
                 [(ngModel)]="username" required autocomplete="username"/>
        </div>
        <div *ngIf="errorMessage" class="alert alert-danger" role="alert">{{errorMessage}}</div>
        <div *ngIf="message" class="alert alert-info" role="alert">{{message}}</div>
        <button type="submit" class="btn btn-primary" [disabled]="!forgotForm.form.valid || submitting">
          Enviar
        </button>
      </form>
    </div>
  </div>
</div>
