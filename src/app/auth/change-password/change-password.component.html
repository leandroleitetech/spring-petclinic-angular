<div class="container login-container">
  <div class="row justify-content-center">
    <div class="col-12 col-md-5">
      <h2>Alterar senha</h2>
      <form (ngSubmit)="onSubmit()" #changeForm="ngForm" novalidate>
        <div class="mb-3">
          <label for="currentPassword" class="form-label">Senha atual</label>
          <input id="currentPassword" name="currentPassword" type="password" class="form-control"
                 [(ngModel)]="currentPassword" required autocomplete="current-password"/>
        </div>
        <div class="mb-3">
          <label for="newPassword" class="form-label">Nova senha</label>
          <input id="newPassword" name="newPassword" type="password" class="form-control"
                 [(ngModel)]="newPassword" required minlength="8" autocomplete="new-password"/>
          <div *ngIf="changeForm.form.get('newPassword')?.errors?.['minlength']" class="form-text text-danger">
            A senha deve ter pelo menos 8 caracteres.
          </div>
        </div>
        <div class="mb-3">
          <label for="confirmPassword" class="form-label">Confirmação da nova senha</label>
          <input id="confirmPassword" name="confirmPassword" type="password" class="form-control"
                 [(ngModel)]="confirmPassword" required autocomplete="new-password"/>
        </div>
        <div *ngIf="errorMessage" class="alert alert-danger" role="alert">{{errorMessage}}</div>
        <div *ngIf="success" class="alert alert-success" role="alert">
          Senha alterada com sucesso. Redirecionando para o login...
        </div>
        <button type="submit" class="btn btn-primary" [disabled]="!changeForm.form.valid || submitting">
          Alterar senha
        </button>
      </form>
    </div>
  </div>
</div>
