<div class="container login-container">
  <div class="row justify-content-center">
    <div class="col-12 col-md-5">
      <h2>Entrar</h2>
      <form (ngSubmit)="onSubmit()" #loginForm="ngForm" novalidate>
        <div class="mb-3">
          <label for="username" class="form-label">Usuário</label>
          <input id="username" name="username" type="text" class="form-control"
                 [(ngModel)]="username" required autocomplete="username"/>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Senha</label>
          <input id="password" name="password" type="password" class="form-control"
                 [(ngModel)]="password" required autocomplete="current-password"/>
        </div>
        <div *ngIf="errorMessage" class="alert alert-danger" role="alert">{{errorMessage}}</div>
        <button type="submit" class="btn btn-primary" [disabled]="!loginForm.form.valid || submitting">Entrar</button>
        <div class="mt-2">
          <a routerLink="/forgot-password">Esqueci minha senha</a>
        </div>
      </form>
    </div>
  </div>
</div>
